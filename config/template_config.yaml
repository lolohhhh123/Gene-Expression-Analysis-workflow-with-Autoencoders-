# Autoencoder Gene Analysis Configuration

data:
  input_dir: "./data/"
  train_dir: "train/"
  test_dir: "test/"
  results_dir: "results/"
  logs_dir: "logs/"
  
  preprocessing:
    normalization_method: "max"  # Options: max, minmax, zscore
    drop_na: true
    replace_nan: 0
    transpose: true

models:
  types:
    - "autoencoder"
    - "vae"
    - "denoising"
    - "sparse"
  
  autoencoder:
    hidden_layers: [512, 256]
    activation: "relu"
    output_activation: "sigmoid"
    
  vae:
    encoder_layers: [256, 128]
    decoder_layers: [128, 256]
    kl_weight: 0.01
    
  denoising:
    noise_rate: 0.2
    hidden_layers: [512, 256, 128]
    
  sparse:
    sparsity_weight: 1e-5
    hidden_dim: 128

training:
  epochs: 50
  batch_size: 32
  validation_split: 0.2
  early_stopping_patience: 10
  reduce_lr_patience: 5
  learning_rate: 0.001
  
  hyperparameter_search:
    embedding_dims: [50, 100, 150, 200, 250, 300]
    epochs_list: [10, 20, 30, 40, 50, 60]
    max_combinations: 8
    cv_folds: 2

random_forest:
  n_estimators: 100
  max_depth: null
  random_state: 42
  n_jobs: -1

gpu:
  visible_devices: "0"
  memory_growth: true
  per_process_gpu_memory_fraction: 0.8

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/training.log"
  
output:
  save_weights: true
  save_embeddings: true
  save_plots: true
  format: "csv"  # Options: csv, parquet, hdf5
  compression: "gzip"
